[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy-emotion"
version = "0.1.0"
description = "Reachy Mini emotion-detection app: detects human emotions and responds with movement and speech"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Reachy Mini robot SDK
    "reachy-mini>=1.0.0",
    # Emotion detection action SDK — ActionCommand / BaseActionHandler types used by reachy_handler
    "emotion-detection-action @ git+https://github.com/saurabh947/emotion-detector.git",
    # Local emotion model runtime (full PyTorch on-device). torchaudio is required transitively
    # by emotion2vec/funasr; declaring it explicitly avoids the import crash the SDK hits without it.
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    # Vision
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    # Text-to-Speech
    "gtts>=2.4.0",
    "pydub>=0.25.0",
    # Gemini conversation
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    # Voice input (STT)
    "SpeechRecognition>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
# Post-install system dependency check/install
reachy-emotion-setup = "reachy_emotion.system_deps:_cli_main"
# Main app CLI
reachy-emotion = "reachy_emotion.main:main"

[project.entry-points."reachy_mini_apps"]
# Single app in the Reachy Mini Control dashboard
reachy_emotion = "reachy_emotion.main:ReachyEmotionApp"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
